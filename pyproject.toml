[project]
name = "stetiq"
version = "0.1.0"
description = "Versioning, evaluation and governance of knowledge-graph ontologies"
authors = [
    { name = "Zäch", email = "60199908+JoaZaech@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.3"]

[project.scripts]
stetiq = "stetiq.cli:app"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a Postgres database (set STETIQ_TEST_POSTGRES_URL)"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
