# The plant-assistant showcase: a separate project that uses stetiq the way a customer
# would, through its public SDK and REST API only. stetiq comes from this repo as a
# path source; lifted into its own repo, that becomes a PyPI pin.
[project]
name = "plant-assistant"
version = "0.1.0"
description = "A GraphRAG plant assistant that stetiq keeps honest (stetiq showcase)"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=6.4",
    "stetiq",
]

[tool.uv]
package = false

[tool.uv.sources]
stetiq = { path = "../..", editable = true }
