# Who uses the library's Knowledge Graph, what they do with it, and the questions that
# work needs answered.
#
# Four Consumers read the graph: the online catalogue, the bot that emails overdue
# reminders, the monthly lending report to the town council, and the acquisitions team
# that buys new stock. popular-books and books-per-author each serve two Tasks.
# authors-who-are-members serves no Task: the head librarian asked it for a local-authors
# evening, and nothing reads it yet.
#
# A question with a `query` is executed against the Graph Source at the end of
# every Construction Run (competency_question_execution). Every question is also
# judged structurally against each Ontology Version (structural_answerability):
# does the Ontology have the Concepts the question needs? Against v1 only the
# first one does; against v3 every mapped question does.
description: "Town library: who wrote what, what is overdue, and what the branches lend."
competency_questions:
  - id: books-per-author
    question: How many books by each author does the library hold?
    query: >-
      MATCH (a:Author)-[:WROTE]->(b:Book)
      RETURN a.name AS author, count(b) AS books ORDER BY books DESC
  - id: overdue-loans
    question: Which loans are overdue today, and which book is out on each?
    # The expected answer names loans and titles, never a member: the Use Case is
    # stored in stetiq, and who holds a book stays in the Graph Source (ADR 0001).
    query: >-
      MATCH (m:Member)-[:BORROWED]->(l:Loan)-[:OF_BOOK]->(b:Book)
      WHERE l.returned IS NULL AND l.due < date('2026-10-30')
      RETURN l.id AS loan, b.title AS book
    expected_answer:
      - {loan: L-9006, book: On the Origin of Species}
      - {loan: L-9008, book: Nineteen Eighty-Four}
      - {loan: L-9010, book: Nineteen Eighty-Four}
  - id: members-per-branch
    question: How many members call each branch their home branch?
    query: >-
      MATCH (m:Member)-[:MEMBER_OF]->(br:Branch)
      RETURN br.name AS branch, count(m) AS members
  - id: popular-books
    question: Which books are borrowed most?
    query: >-
      MATCH (l:Loan)-[:OF_BOOK]->(b:Book)
      RETURN b.title AS book, count(l) AS loans ORDER BY loans DESC
  - id: books-by-subject
    question: Which books does the library hold on a given subject heading?
    # An explicit Concept mapping instead of a query: judged structurally, not executed.
    concepts: [Book, Subject, "(Book)-[HAS_SUBJECT]->(Subject)", Subject.heading]
  - id: authors-who-are-members
    question: Which authors in the catalogue also hold a library card?
    # Neither a query nor a Concept mapping yet: stetiq reports it as unmapped.
consumers:
  - id: catalogue-search
    name: Online catalogue
    kind: application
    contact: Ines Ferreira
    description: The library website's search page.
    tasks:
      - id: find-books
        description: Find books by subject heading or by author
        competency_questions: [books-by-subject, books-per-author]
  - id: overdue-reminders
    name: Overdue reminder bot
    kind: agent
    contact: Ines Ferreira
    description: Emails a reminder each morning for every loan past its due date.
    tasks:
      - id: send-reminders
        description: Remind the borrower of each overdue loan which book to bring back
        competency_questions: [overdue-loans]
  - id: lending-report
    name: Monthly lending report
    kind: report
    contact: Ines Ferreira
    description: What the library reports to the town council each month.
    tasks:
      - id: report-to-council
        description: Report members per branch and the most borrowed books
        competency_questions: [members-per-branch, popular-books]
  - id: acquisitions-team
    name: Acquisitions
    kind: team
    contact: Kwame Mensah
    description: Decides which books to buy and which extra copies to order.
    tasks:
      - id: choose-new-stock
        description: Order more copies of what is borrowed most and fill gaps in authors' work
        competency_questions: [popular-books, books-per-author]
