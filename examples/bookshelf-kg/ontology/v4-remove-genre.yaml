# Town library Knowledge Graph, Ontology Version 4: Genre is gone.
#
# Compared with v3-deprecate-genre.yaml, Genre and IN_GENRE are removed outright.
# A deprecation is a warning; a removal takes something away from everyone who
# still reads it, so the Ontology Diff from v3 is "breaking" and the Gate rejects it.
node_types:
  - label: Person
    description: Anyone the library knows by name
    properties:
      - {name: name, type: STRING, required: true}
  - label: Author
    description: A person who wrote a book in the catalogue
    parent: Person
  - label: Member
    description: A person holding a library card
    parent: Person
    properties:
      - {name: card, type: STRING, required: true}
  - label: Book
    description: One title in the catalogue
    properties:
      - {name: isbn, type: STRING, required: true}
      - {name: title, type: STRING, required: true}
      - {name: year, type: INTEGER}
  - label: Branch
    description: A library building
    properties:
      - {name: code, type: STRING, required: true}
      - {name: name, type: STRING, required: true}
  - label: Loan
    description: One checkout from the circulation log
    properties:
      - {name: id, type: STRING, required: true}
      - {name: borrowed, type: DATE, required: true}
      - {name: due, type: DATE, required: true}
      - {name: returned, type: DATE, description: Empty while the book is out}
  - label: Subject
    description: A controlled subject heading (MARC 650)
    properties:
      - {name: heading, type: STRING, required: true}
relationship_types:
  - WROTE
  - HELD_AT
  - MEMBER_OF
  - BORROWED
  - OF_BOOK
  - MANAGES
  - HAS_SUBJECT
patterns:
  - [Author, WROTE, Book]
  - [Book, HELD_AT, Branch]
  - [Member, MEMBER_OF, Branch]
  - [Member, BORROWED, Loan]
  - [Loan, OF_BOOK, Book]
  - [Person, MANAGES, Branch]
  - [Book, HAS_SUBJECT, Subject]
constraints:
  - {type: UNIQUENESS, node_type: Book, property_name: isbn}
  - {type: UNIQUENESS, node_type: Person, property_name: name}
  - {type: UNIQUENESS, node_type: Member, property_name: card}
