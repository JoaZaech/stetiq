# Trial registry Knowledge Graph, Ontology Version 1.
# Written by the clinical data manager from the registry's table definitions. Every
# Concept is documented from the start: in a regulated registry the Ontology is the
# contract the loader has to honour, and strict Evolution Mode enforces it.
#
# Participants are pseudonymous: pseudonym, age band and enrolment date, nothing else.
node_types:
  - label: Trial
    description: One registered clinical trial
    properties:
      - {name: registry_id, type: STRING, required: true, description: "The registry number, e.g. TR-2024-011"}
      - {name: title, type: STRING, description: Public title}
      - {name: phase, type: STRING, description: "I, II, III or IV"}
  - label: Site
    description: A hospital or practice where a trial recruits
    properties:
      - {name: site_id, type: STRING, required: true}
      - {name: city, type: STRING}
  - label: Investigator
    description: The clinician responsible for a site, by staff id
    properties:
      - {name: staff_id, type: STRING, required: true}
      - {name: specialty, type: STRING}
      - {name: orcid, type: STRING, description: "ORCID iD, when the investigator has one"}
  - label: Participant
    description: A pseudonymous trial participant (no name, no date of birth, no contact details)
    properties:
      - {name: pseudonym, type: STRING, required: true, description: "The registry pseudonym, e.g. P-10037"}
      - {name: age_band, type: STRING, description: "Ten-year age band, e.g. 60-69"}
      - {name: enrolled_on, type: DATE}
  - label: Intervention
    description: What a trial tests; Drug, Device and Procedure are its subtypes
    properties:
      - {name: code, type: STRING, required: true}
      - {name: name, type: STRING, required: true}
  - label: Drug
    description: A medicinal product
    parent: Intervention
  - label: Device
    description: A medical device
    parent: Intervention
  - label: Procedure
    description: A clinical procedure or care pathway
    parent: Intervention
  - label: Condition
    description: The condition a trial studies, by ICD-10-like code
    properties:
      - {name: code, type: STRING, required: true}
      - {name: term, type: STRING}
  - label: AdverseEvent
    description: An adverse event reported during a trial
    properties:
      - {name: ae_id, type: STRING, required: true}
      - {name: severity, type: STRING, description: "mild, moderate or severe"}
      - {name: serious, type: BOOLEAN, description: Serious under the protocol's definition}
      - {name: onset, type: DATE}
  - label: Visit
    description: A scheduled participant visit
    properties:
      - {name: visit_id, type: STRING, required: true}
      - {name: number, type: INTEGER, description: Visit number within the schedule}
      - {name: scheduled, type: DATE}
      - {name: deviation, type: STRING, description: "The protocol deviation recorded at this visit, if any"}
relationship_types:
  - label: CONDUCTED_AT
    description: The sites a trial recruits at
  - label: LED_BY
    description: The investigator responsible for a site
  - label: ENROLLED_AT
    description: The site a participant was enrolled at
  - label: CONSENTED_TO
    description: The trial a participant gave informed consent to
  - label: TESTS
    description: The interventions a trial tests
  - label: STUDIES
    description: The condition a trial studies
  - label: REPORTED_IN
    description: The trial an adverse event was reported in
  - label: ATTENDED
    description: The visits of a participant
patterns:
  - [Trial, CONDUCTED_AT, Site]
  - [Site, LED_BY, Investigator]
  - [Participant, ENROLLED_AT, Site]
  - [Participant, CONSENTED_TO, Trial]
  - [Trial, TESTS, Intervention]
  - [Trial, TESTS, Drug]
  - [Trial, TESTS, Device]
  - [Trial, TESTS, Procedure]
  - [Trial, STUDIES, Condition]
  - [AdverseEvent, REPORTED_IN, Trial]
  - [Participant, ATTENDED, Visit]
constraints:
  - {type: UNIQUENESS, node_type: Trial, property_name: registry_id}
  - {type: UNIQUENESS, node_type: Participant, property_name: pseudonym}
  - {type: UNIQUENESS, node_type: Investigator, property_name: orcid}   # optional: see constraint_consistency
