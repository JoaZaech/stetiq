name: CI

# Docs-only changes (Markdown anywhere, anything under docs/) skip CI: they cannot change
# behaviour. The exceptions are docs/guide/ and docs/vision.md, which the web UI bundles
# and the tests check (ADR 0004), so they still run it. Later patterns override earlier
# ones. GitHub ignores path filters on tag pushes, so a release always runs.
on:
  push:
    branches: [main]
    # A release: the image job publishes :X.Y.Z, :X.Y and :latest.
    tags: ['v*']
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      - 'docs/guide/**'
      - 'docs/vision.md'
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!.claude/**'
      - 'docs/guide/**'
      - 'docs/vision.md'

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Playwright drives a real `stetiq ui`, seeded through the Python SDK.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      # The Python job checks that the wheel ships this build.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/stetiq/_frontend
          if-no-files-found: error

  check:
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: stetiq
          POSTGRES_DB: stetiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Runs the Postgres mode of every SDK test; the Neo4j contract tests start
      # their own container through testcontainers on the runner's Docker.
      STETIQ_TEST_POSTGRES_URL: postgresql+psycopg://postgres:stetiq@localhost:5432/stetiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/stetiq/_frontend
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests frontend/e2e
      - run: uv run ruff format --check src tests frontend/e2e
      - run: uv run pyright
      # The Docker image tests belong where the image is built, not in this job.
      - run: uv run pytest -m "not image"

  # The demo image (Dockerfile). Pull requests stop at the tests above. A push to main
  # builds both architectures and tests amd64, so main is always built and tested; only
  # a v* tag publishes it.
  image:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/joazaech/stetiq
      # Only a release tag publishes; a push to main builds and tests without pushing.
      PUBLISH: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@v4
      # A release tag must name the version the wheel in the image carries.
      - name: Check the tag matches the pyproject.toml version
        if: github.ref_type == 'tag'
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project.version $version in pyproject.toml"
            exit 1
          fi
      # The UI that passed the frontend job's tests, not a second build.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/stetiq/_frontend
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # One place for the image's tags and OCI labels: a tag vX.Y.Z gives :X.Y.Z, :X.Y
      # and :latest; main gives none, as it does not publish. latest=false stops
      # metadata-action adding :latest on its own, so only a release tag moves it.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
      - name: Build amd64 for the image test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stetiq:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The SEED=none variant (no plant-kg seed, `stetiq server`) is tested, never published.
      - name: Build the no-seed variant for the image test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          build-args: SEED=none
          tags: stetiq:test-no-seed
          cache-from: type=gha
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Test the image
        run: uv run pytest -m image
        env:
          STETIQ_TEST_IMAGE: stetiq:test
          STETIQ_TEST_IMAGE_NO_SEED: stetiq:test-no-seed
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main builds both architectures too, so a Dockerfile that breaks arm64 fails on
      # main, not first at release; only a release tag pushes.
      - name: Build amd64 + arm64, and push from a release tag
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
