name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: stetiq
          POSTGRES_DB: stetiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Runs the Postgres mode of every SDK test; the Neo4j contract tests start
      # their own container through testcontainers on the runner's Docker.
      STETIQ_TEST_POSTGRES_URL: postgresql+psycopg://postgres:stetiq@localhost:5432/stetiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pyright
      - run: uv run pytest -q
