name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Playwright drives a real `stetiq ui`, seeded through the Python SDK.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      # The Python job checks that the wheel ships this build.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/stetiq/_frontend
          if-no-files-found: error

  check:
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: stetiq
          POSTGRES_DB: stetiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Runs the Postgres mode of every SDK test; the Neo4j contract tests start
      # their own container through testcontainers on the runner's Docker.
      STETIQ_TEST_POSTGRES_URL: postgresql+psycopg://postgres:stetiq@localhost:5432/stetiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/stetiq/_frontend
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests frontend/e2e
      - run: uv run ruff format --check src tests frontend/e2e
      - run: uv run pyright
      - run: uv run pytest -q
