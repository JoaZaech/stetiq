name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Playwright drives a real `stetiq ui`, seeded through the Python SDK.
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
        working-directory: .
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report
      # The Python job checks that the wheel ships this build.
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: src/stetiq/_frontend
          if-no-files-found: error

  check:
    needs: frontend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: stetiq
          POSTGRES_DB: stetiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Runs the Postgres mode of every SDK test; the Neo4j contract tests start
      # their own container through testcontainers on the runner's Docker.
      STETIQ_TEST_POSTGRES_URL: postgresql+psycopg://postgres:stetiq@localhost:5432/stetiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/stetiq/_frontend
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check src tests frontend/e2e
      - run: uv run ruff format --check src tests frontend/e2e
      - run: uv run pyright
      # The Docker image tests belong where the image is built, not in this job.
      - run: uv run pytest -m "not image"

  # The demo image (Dockerfile). Every run builds both architectures and tests amd64;
  # only a push to main publishes it.
  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/joazaech/stetiq
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      # The UI that passed the frontend job's tests, not a second build.
      - uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: src/stetiq/_frontend
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # One place for the image's tags and OCI labels: main gives :main and :sha-<short>.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha
      - name: Build amd64 for the image test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stetiq:test
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Test the image
        run: uv run pytest -m image
        env:
          STETIQ_TEST_IMAGE: stetiq:test
      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests still build both architectures, so a Dockerfile that breaks arm64
      # fails before merge; only main pushes.
      - name: Build amd64 + arm64, and push from main
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
